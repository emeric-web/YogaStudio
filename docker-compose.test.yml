services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yoga_test
      POSTGRES_PASSWORD: yoga_test
      POSTGRES_DB: yogastudio_test
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoga_test -d yogastudio_test"]
      interval: 2s
      timeout: 5s
      retries: 30